<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0c">
  <meta name="description" content="BLOOM is a live multiplayer painting game. Share a room code and take the floor. No accounts.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BLOOM">
  <title>BLOOM</title>
  <link rel="icon" href="/bloom.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/bloom.css">
</head>
<body>
  <canvas id="court"></canvas>
  <div class="shade"></div>
  <header id="hud" hidden></header>
  <div id="count" hidden></div>
  <div id="banner" hidden></div>
  <div id="panel"></div>
  <p id="net" hidden>Reconnecting…</p>
  <div id="toast" role="status"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/bloom.js"></script>
</body>
</html>
