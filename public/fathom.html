<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07161c">
  <meta name="description" content="FATHOM is a live multiplayer dive. Carry the bells up. No accounts.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FATHOM">
  <title>FATHOM</title>
  <link rel="icon" href="/fathom.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/fathom.css">
</head>
<body>
  <canvas id="cave"></canvas>
  <header id="hud" hidden></header>
  <div id="count" hidden></div>
  <div id="panel"></div>
  <p id="net" hidden>Reconnecting…</p>
  <div id="toast" role="status"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/fathom.js"></script>
</body>
</html>
